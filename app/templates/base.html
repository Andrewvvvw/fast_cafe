<!DOCTYPE html>
<html lang="ru" class="min-h-screen bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fast Cafe{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 pt-16">

    <nav class="fixed top-0 left-0 right-0 z-40 w-full bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-amber-600 text-white p-2 rounded-xl shadow-md shadow-amber-600/20">
                        <i class="fa-solid fa-mug-hot text-xl"></i>
                    </div>
                    <span class="text-xl font-bold tracking-tight text-slate-900">Fast<span class="text-amber-600">Cafe</span></span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/" class="text-sm font-medium text-slate-600 hover:text-amber-600 transition-colors">Витрина</a>
                    <a href="/dashboard" class="text-sm font-medium text-slate-600 hover:text-amber-600 transition-colors flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-lg hover:bg-amber-50">
                        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        Панель бариста
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
